name: Actionlint

# Lints GitHub Actions workflow YAML for syntax errors, expression typos,
# unused vars, and deprecated patterns, then validates remote action pins.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  actionlint:
    name: Actionlint
    permissions:
      contents: read
    uses: NDDev-OpenNetwork/ci-workflows/.github/workflows/actionlint.yml@1eaaa687f32f81c33ac99be3db0b76d0204420b8 # 0.1.8
    with:
      # Public repo: pull_request runs untrusted fork code. Pin the hosted runner
      # explicitly — several ci-workflows reusables now default `runner` to the
      # self-hosted `amsterdam` label, so inheriting the default on a pin bump
      # would put fork PRs on trusted private infrastructure.
      runner: ubuntu-latest
      post_command: python3 scripts/validate_action_pins.py
