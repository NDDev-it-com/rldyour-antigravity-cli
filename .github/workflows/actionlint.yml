name: Actionlint

# Lints GitHub Actions workflow YAML for syntax errors, expression typos,
# unused vars, and deprecated patterns, then validates remote action pins.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'scripts/validate_action_pins.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'scripts/validate_action_pins.py'
  workflow_dispatch:

permissions: {}

concurrency:
  group: actionlint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    name: Actionlint
    permissions:
      contents: read
    uses: NDDev-it-com/nddev-ci-workflows/.github/workflows/actionlint.yml@71f4345cad2998a16e8e14b800eee88c68d865ac # 0.2.3
    with:
      post_command: python3 scripts/validate_action_pins.py
