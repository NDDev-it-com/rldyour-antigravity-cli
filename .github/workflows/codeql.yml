name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "31 2 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    uses: NDDev-it-com/ci-workflows/.github/workflows/public-codeql.yml@7f69c724923d06b2c2057c5a6ad341c37f1a8995 # 0.13.3
    with:
      languages: '["${{ matrix.language }}"]'
