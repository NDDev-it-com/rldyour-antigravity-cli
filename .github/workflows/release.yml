name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release from VERSION (numeric SemVer X.Y.Z). Creates the tag when dispatching manually."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install validation dependencies
        run: python3 -m pip install --user "pytest==9.1.1" "pytest-cov==7.1.0"
      - name: Resolve release version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="$REF_NAME"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "release version '$version' is not numeric SemVer X.Y.Z" >&2
            exit 1
          fi
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [ "$version" != "$file_version" ]; then
            echo "release version '$version' does not match VERSION '$file_version'" >&2
            exit 1
          fi
          printf 'RELEASE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - name: Validate release
        run: scripts/validate_release.sh
      - name: Create release tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${RELEASE_VERSION}" >/dev/null; then
            echo "Tag ${RELEASE_VERSION} already exists locally"
          else
            git tag "${RELEASE_VERSION}"
            git push origin "refs/tags/${RELEASE_VERSION}"
          fi
      - name: Build source archive
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=zip --prefix=rldyour-antigravity-cli/ -o dist/rldyour-antigravity-cli-source.zip HEAD
          python3 scripts/release_sbom.py --output dist/sbom.spdx.json
          sha256sum dist/rldyour-antigravity-cli-source.zip dist/sbom.spdx.json > dist/SHA256SUMS
          python3 scripts/validate_release_assets.py dist
      - name: Attest source archive
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: dist/rldyour-antigravity-cli-source.zip
      - name: Attest SBOM
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: dist/sbom.spdx.json
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${RELEASE_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/rldyour-antigravity-cli-source.zip dist/SHA256SUMS dist/sbom.spdx.json --clobber
            gh release edit "$tag" --title "$tag" --notes-file CHANGELOG.md --draft=false --prerelease=false
          else
            gh release create "$tag" dist/rldyour-antigravity-cli-source.zip dist/SHA256SUMS dist/sbom.spdx.json \
              --title "$tag" \
              --notes-file CHANGELOG.md \
              --verify-tag
          fi
