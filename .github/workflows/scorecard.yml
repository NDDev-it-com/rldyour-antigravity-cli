name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "21 6 * * 3"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  scorecard:
    name: Scorecard
    permissions:
      id-token: write
      contents: read
      actions: read
    uses: NDDev-OpenNetwork/ci-workflows/.github/workflows/public-scorecard-json.yml@1eaaa687f32f81c33ac99be3db0b76d0204420b8 # 0.1.8
    with:
      publish_results: false
