name = "release:check"
description = "RU: release readiness проверка Antigravity adapter. EN: release readiness check for the Antigravity adapter."
prompt = """
Check release readiness for this Antigravity adapter.

Required checks:
- Adapter version surfaces match VERSION.
- Antigravity CLI baseline is `agy` 1.0.11 unless live stable evidence proves a newer target.
- Native Antigravity surfaces validate.
- MCP inventory is exactly the 11 active servers.
- Antigravity transition policy is documented.
- No unapproved active providers, secrets, caches, runtime markers, or generated junk are active.
- CI workflows use public/free GitHub-hosted runners and full SHA action pins.

User args: {{args}}
"""
